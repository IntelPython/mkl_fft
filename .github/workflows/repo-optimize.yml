name: Weekly performance and correctness sweep

# Unattended agentic sweep. Looks for one behaviour-preserving speedup in the FFT
# implementation, or one genuine bug fix, and opens a pull request; never pushes
# to a protected branch and never merges. CI's benchmark reporting measures the
# effect on the resulting pull request — this workflow does not judge performance,
# only correctness.
#
# The agent may edit source, so two controls carry the weight:
#   1. "Enforce scope" fails the run if the diff touches the benchmark suite,
#      build configuration, packaging, or this automation. Under mkl_fft/tests a
#      new test_*.py is allowed and an existing test may be corrected, but
#      removing a test function or adding a skip/xfail is refused and any
#      modification is flagged on the pull request for review.
#   2. "Rebuild and run the full test suite" must be green before a pull request
#      can exist.
#
# Trigger surface is deliberately narrow. Scheduled runs always execute the
# workflow file from the default branch in this repository's context, and
# workflow_dispatch requires write access, so no non-member can invoke this.
# Do not add issue_comment or pull_request_target triggers: on a public repo
# that would let any account start a job holding credentials.

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC (off-the-hour to avoid scheduler contention)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the sweep, scope check and tests, but do not push or open a pull request'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # never interrupt a run that may be mid-push

env:
  SWEEP_BRANCH: chore/repo-optimize

jobs:
  optimize:
    name: Sweep and open pull request

    # Keep forks from running this on their own schedule.
    if: github.repository == 'IntelPython/mkl_fft'

    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Gates secrets.ANTHROPIC_API_KEY behind an environment restricted to the
    # default branch, so no other workflow context can reach it.
    environment: agentic-maintenance

    permissions:
      contents: read # the agent gets read-only credentials; writes happen via the app token below

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout mkl_fft repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Detached HEAD, as pre-commit.yml does, so the "no-commit-to-branch"
          # hook does not fire during verification. That hook is always_run, so
          # scoping the run with --files would not skip it.
          ref: ${{ github.sha }}

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: sweep
          # Any version inside the requires-python range in pyproject.toml works;
          # build_pip.yml is canonical for the matrix CI actually covers.
          python-version: '3.13'

      - name: Install build and test dependencies
        run: |
          conda install -y mkl-devel numpy scipy mkl-service \
            meson-python ninja cmake cython pytest pip

      - name: Build mkl_fft
        run: pip install -e ".[test]" --no-build-isolation

      - name: Confirm the baseline suite is green
        run: pytest mkl_fft/tests -q

      # Put the environment on PATH for every later step, including the
      # subprocesses the agent spawns, which do not get a login shell.
      - name: Expose the environment to later steps
        run: echo "$CONDA_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run the performance sweep
        uses: anthropics/claude-code-action@e337a86d5fec66d2a465637dff1b9ffedd91dd22 # v1.0.227
        env:
          # Redirect the runner's environment files to throwaways. Anything the
          # agent writes to them is discarded instead of being applied to later
          # steps, which would otherwise let it alter PATH or inject variables
          # into the steps that hold the write-capable token.
          GITHUB_ENV: ${{ runner.temp }}/discarded-env
          GITHUB_PATH: ${{ runner.temp }}/discarded-path
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Short-lived, scoped to this job's contents:read. The agent cannot
          # push or open a pull request with it; later steps do that.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Run the `repo-optimize` skill in this repository
            (`.claude/skills/repo-optimize/SKILL.md`). It is your complete
            mandate: follow its scope, task list and rules exactly.

            The goal is one behaviour-preserving performance improvement in the
            FFT implementation, or — if you find one while looking — one genuine
            bug fix, which takes precedence. Exactly one of the two, never both.
            Documentation upkeep is only for weeks where you find neither.

            A bug fix must come with a new `mkl_fft/tests/test_<name>.py` that you
            saw fail before the fix. If an existing test encoded the bug you may
            correct it, but you must justify each such change in your report as
            the skill describes; removing a test or adding a skip is refused.

            The package is already built in editable mode in the active conda
            environment, so `pytest mkl_fft/tests` runs immediately and
            `meson-python` rebuilds the extension on import after you edit
            `.pyx` or `.c.src` files.

            Two adjustments for this environment:

            - You have read-only GitHub credentials. Do not run `git commit`,
              `git push`, or any `gh` command. Leave your work as uncommitted
              changes in the working tree; the workflow checks your diff against
              the allowed paths, re-runs the full suite, and then commits.
            - Write a one-line title to `pr-title.txt` and your report to
              `pr-body.md`, both in the repository root. The title must start with
              `perf:` or `fix:`. The workflow moves both out of the tree before
              committing, so neither appears in the diff. If you made no changes,
              do not create them.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(pip:*),Bash(pytest:*),Bash(python:*),Bash(python3:*),Bash(asv:*),Bash(meson:*),Bash(ninja:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git ls-files:*),Bash(pre-commit run:*)"

      # Authoritative scope check. Runs before any credential that could push.
      - name: Enforce scope
        id: scope
        run: |
          # The guard can only see worktree paths, never .git/**. Discard any
          # hook the agent may have left behind before running a git command
          # that would execute it. The agent has stopped, so it cannot undo this.
          rm -rf .git/hooks

          # The agent leaves its title and report in the worktree; lift them out
          # before staging so they are never part of the proposed diff.
          for f in pr-title.txt pr-body.md; do
            if [ -f "$f" ]; then
              mv "$f" "$RUNNER_TEMP/$f"
            fi
          done

          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes produced; nothing to propose."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Denied paths outrank allowed ones. The benchmark suite is the
          # instrument that judges this sweep, so the sweep cannot edit it.
          DENY='^([.]github/workflows/|[.]claude/|_vendored/|benchmarks/|conda-recipe|CHANGELOG[.]md$|meson[.]build$|pyproject[.]toml$|mkl_fft/_version[.]py$)'
          ALLOW='^(mkl_fft/.+|[A-Za-z0-9_.-]+[.]md|docs/.+|(.+/)?AGENTS[.]md|[.]github/pull_request_template[.]md|[.]github/ISSUE_TEMPLATE/.+|[.]gitignore|[.]gitattributes)$'
          # A bug fix needs a regression test, so a new test file is allowed.
          # Modifying an existing test is allowed too — a test can encode the very
          # bug being fixed — but it is flagged for review, and the two ways a
          # suite gets quietly weakened are refused outright below.
          NEW_TEST='^mkl_fft/tests/test_[a-z0-9_]+[.]py$'
          # Removing a test, or silencing one with a skip/xfail marker, is never
          # part of a legitimate fix.
          DROPPED_TEST='^-[[:space:]]*def[[:space:]]+test_'
          ADDED_SKIP='^\+[[:space:]]*(@pytest\.mark\.(skip|skipif|xfail)|pytest\.(skip|xfail)\()'

          violations=0
          modified_tests=()

          # --no-renames matters: with rename detection on, moving an
          # out-of-scope file to an in-scope path shows the guard only the
          # allowed destination and hides the source deletion entirely.
          while IFS= read -r -d '' status && IFS= read -r -d '' f; do
            case "$f" in
              /* | *..*)
                # Unreachable via the index, which normalises paths, but the
                # guard must not depend on that.
                echo "::error::refusing suspicious path: $f"
                violations=$((violations + 1))
                continue
                ;;
            esac

            # Deletions are always suspect, even of an in-scope path.
            if [ "$status" = "D" ]; then
              echo "::error file=$f::sweep deleted a file; deletions are out of scope"
              violations=$((violations + 1))
              continue
            fi

            case "$f" in
              mkl_fft/tests/conftest.py)
                # A conftest changes collection and fixtures for the whole suite,
                # which is a way to defang tests without editing one.
                echo "::error file=$f::conftest.py is off limits; it changes collection for the whole suite"
                violations=$((violations + 1))
                continue
                ;;
              mkl_fft/tests/*)
                if [ "$status" = "A" ]; then
                  if printf '%s' "$f" | grep -Eq "$NEW_TEST"; then
                    echo "in scope (new regression test): $f"
                  else
                    echo "::error file=$f::a new file under mkl_fft/tests/ must be named test_<name>.py"
                    violations=$((violations + 1))
                  fi
                elif [ "$status" = "M" ]; then
                  echo "::warning file=$f::sweep modified an existing test; this needs explicit review"
                  modified_tests+=("$f")
                else
                  echo "::error file=$f::unexpected change type '$status' under mkl_fft/tests/"
                  violations=$((violations + 1))
                fi
                continue
                ;;
            esac

            if printf '%s' "$f" | grep -Eq "$DENY"; then
              echo "::error file=$f::forbidden path (benchmarks, build config, packaging, agent config)"
              violations=$((violations + 1))
            elif ! printf '%s' "$f" | grep -Eq "$ALLOW"; then
              echo "::error file=$f::outside the allowed sweep scope"
              violations=$((violations + 1))
            else
              echo "in scope: $f"
            fi
          done < <(git diff --cached --name-status -z --no-renames)

          # Content checks on modified tests only. A new test file is the agent's
          # own work and may legitimately carry a platform skipif; an existing one
          # losing a test or gaining a skip is how coverage disappears.
          if [ "${#modified_tests[@]}" -gt 0 ]; then
            if git diff --cached -- "${modified_tests[@]}" | grep -Eq "$DROPPED_TEST"; then
              echo "::error::a test function was removed from an existing test file; retiring a test is a human decision"
              violations=$((violations + 1))
            fi
            if git diff --cached -- "${modified_tests[@]}" | grep -Eq "$ADDED_SKIP"; then
              echo "::error::a skip/xfail marker was added to an existing test; a fix never needs to silence one"
              violations=$((violations + 1))
            fi
            printf 'tests_modified=%s\n' "${modified_tests[*]}" >> "$GITHUB_OUTPUT"
          fi

          if [ "$violations" -gt 0 ]; then
            echo "::error::sweep touched $violations out-of-scope path(s); refusing to propose a pull request"
            exit 1
          fi

      # The correctness gate. The agent could not edit these tests.
      - name: Rebuild and run the full test suite
        if: steps.scope.outputs.changed == 'true'
        run: |
          pip install -e ".[test]" --no-build-isolation
          pytest mkl_fft/tests

      - name: Verify with the repository's own hooks
        if: steps.scope.outputs.changed == 'true'
        run: |
          # Scope the run to the files the sweep touched, excluding deletions so
          # pre-commit is never handed a path that no longer exists.
          git diff --cached --name-only -z --no-renames --diff-filter=d \
            | xargs -0 --no-run-if-empty pre-commit run --files

      # Minted last, and only if the diff is in scope and the suite is green.
      - name: Mint a repository-scoped app token
        id: app-token
        if: steps.scope.outputs.changed == 'true' && !inputs.dry_run
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          # A PR opened by an app token triggers the repository's CI — including
          # benchmark reporting — which a PR opened by GITHUB_TOKEN would not.
          permission-contents: write
          permission-pull-requests: write

      - name: Commit and push the sweep
        id: commit
        if: steps.scope.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          # -c core.hooksPath overrides any hooksPath the agent may have written
          # into .git/config; command-line config beats config files.
          # The agent proposes the subject line; take only the first line, cap the
          # length, and fall back to a neutral default. Passed as an argument,
          # never evaluated.
          title='chore: weekly performance and correctness sweep'
          if [ -s "$RUNNER_TEMP/pr-title.txt" ]; then
            candidate="$(head -n 1 "$RUNNER_TEMP/pr-title.txt" | tr -d '\r' | cut -c1-72)"
            case "$candidate" in
              perf:*|fix:*) title="$candidate" ;;
              *) echo "::warning::ignoring pr-title.txt: expected a perf: or fix: prefix" ;;
            esac
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

          git -c core.hooksPath=/dev/null checkout -B "$SWEEP_BRANCH"
          git -c core.hooksPath=/dev/null commit --no-verify --quiet -m "$title"

          # checkout only fetched the default branch, so there is no
          # remote-tracking ref for the sweep branch and a bare
          # --force-with-lease would have no lease to check. Read the remote
          # value directly and lease against it; first run has none.
          remote_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          expected="$(git ls-remote "$remote_url" "refs/heads/$SWEEP_BRANCH" | cut -f1)"
          if [ -n "$expected" ]; then
            git push --force-with-lease="refs/heads/$SWEEP_BRANCH:$expected" \
              "$remote_url" "HEAD:refs/heads/$SWEEP_BRANCH"
          else
            git push "$remote_url" "HEAD:refs/heads/$SWEEP_BRANCH"
          fi

      - name: Open or update the pull request
        if: steps.scope.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_TITLE: ${{ steps.commit.outputs.title }}
          TESTS_MODIFIED: ${{ steps.scope.outputs.tests_modified }}
        run: |
          BODY="$RUNNER_TEMP/pr-body.md"
          if [ ! -s "$BODY" ]; then
            printf '%s\n' \
              'Automated performance and correctness sweep.' '' \
              'The agent did not leave a report, so review the diff on its own merits.' > "$BODY"
          fi

          # An existing test changing is the one thing a reviewer must not skim.
          if [ -n "$TESTS_MODIFIED" ]; then
            {
              echo '> [!IMPORTANT]'
              echo '> This sweep modified existing tests:'
              for t in $TESTS_MODIFIED; do echo "> - \`$t\`"; done
              echo '>'
              echo '> Check each change corrects what the test asserted, rather than'
              echo '> accommodating the diff. Removing a test or adding a skip is'
              echo '> refused automatically; changing an assertion is not.'
              echo
              cat "$BODY"
            } > "$BODY.annotated"
            mv "$BODY.annotated" "$BODY"
          fi

          existing="$(gh pr list --head "$SWEEP_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$PR_TITLE" --body-file "$BODY"
            echo "Updated pull request #$existing"
          else
            gh pr create \
              --base master \
              --head "$SWEEP_BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$BODY"
          fi

      - name: Report dry-run result
        if: steps.scope.outputs.changed == 'true' && inputs.dry_run
        run: |
          echo "### Dry run: in-scope changes produced and tested, not pushed" >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
