name: Build project with IntelLLVM clang compiler

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-with-clang:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # TODO: add "3.15" back once mkl-service publishes a Python 3.15 wheel on PyPI
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        numpy_version: ["'numpy>=2'"]

    env:
      ONEAPI_ROOT: /opt/intel/oneapi

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Add Intel repository
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update

      - name: Install Intel oneAPI
        run: |
          sudo apt-get install intel-oneapi-compiler-dpcpp-cpp
          sudo apt-get install intel-oneapi-mkl-devel

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install mkl_fft dependencies
        run: |
          pip install meson-python ninja "cython>=3.1.0" cmake
          pip install ${{ matrix.numpy_version }}

      - name: List oneAPI folder content
        run: ls ${{ env.ONEAPI_ROOT }}/compiler

      - name: Build mkl_fft
        run: |
          source ${{ env.ONEAPI_ROOT }}/setvars.sh
          echo "$CMPLR_ROOT"
          export CC=$CMPLR_ROOT/bin/icx
          export CFLAGS="${CFLAGS} -fno-fast-math -O2"
          pip install -e . --no-build-isolation --no-deps --verbose

      - name: Run mkl_fft tests
        run: |
          source ${{ env.ONEAPI_ROOT }}/setvars.sh
          pip install scipy pytest
          pip install mkl-service --no-deps
          pytest -s -v --pyargs mkl_fft
