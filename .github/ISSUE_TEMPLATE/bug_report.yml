name: Bug report
description: Report incorrect results, a crash, or a build failure
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not open an issue — follow
        [SECURITY.md](https://github.com/IntelPython/mkl_fft/blob/master/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: A minimal, self-contained snippet. Include the input shape and dtype.
      render: python
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: How was `mkl_fft` installed?
      options:
        - Intel channel (software.repos.intel.com)
        - conda-forge
        - pip / PyPI
        - Built from source
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        Output of:
        ```
        python -c "import mkl_fft, numpy, mkl; print(mkl_fft.__version__); print(numpy.__version__); print(mkl.get_version_string())"
        ```
        Add your OS and Python version too.
      render: shell
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: |
        Optional. Whether NumPy patching was active (`mkl_fft.is_patched()`), whether
        the result differs from `numpy.fft`/`scipy.fft`, or a non-default
        `MKL_NUM_THREADS`.
    validations:
      required: false
