# Python versions for ci/matrix.py, one per line, without selectors
python:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14.* *_cp314"
    - "3.14.* *_cp314t"
    - "3.15.* *_cp315"
numpy:
    - '2'
c_compiler:                   # [linux]
    - gcc                     # [linux]
cxx_compiler:                 # [linux]
    - gxx                     # [linux]
cxx_compiler_version:         # [linux]
    - '14'                    # [linux]
c_stdlib:                     # [linux]
    - sysroot                 # [linux]
c_stdlib_version:             # [linux]
    - '2.28'                  # [linux]
c_stdlib:                     # [win]
    - vs                      # [win]
cxx_compiler:                 # [win]
    - vs2022                  # [win]
c_compiler:                   # [win]
    - vs2022                  # [win]
c_compiler:                   # [osx]
    - clang                   # [osx]
c_compiler_version:           # [osx]
    - '21'                    # [osx]
c_stdlib:                     # [osx]
    - macosx_deployment_target  # [osx]
c_stdlib_version:             # [osx]
    - '11.0'                  # [osx]
MACOSX_DEPLOYMENT_TARGET:     # [osx]
    - '11.0'                  # [osx]
