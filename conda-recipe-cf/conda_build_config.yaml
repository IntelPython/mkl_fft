# The Python versions to build, one per line and without selectors: ci/matrix.py
# reads them for .github/workflows/intel-ci.yml. NumPy 2, as in conda-forge's
# global pinning; conda-package-cf.yml passes its own with --python and --numpy.
python:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14.* *_cp314"
    - "3.14.* *_cp314t"
    - "3.15.* *_cp315"
numpy:
    - '2'
c_compiler:                   # [linux]
    - gcc                     # [linux]
cxx_compiler:                 # [linux]
    - gxx                     # [linux]
cxx_compiler_version:         # [linux]
    - '14'                    # [linux]
c_stdlib:                     # [linux]
    - sysroot                 # [linux]
c_stdlib_version:             # [linux]
    - '2.28'                  # [linux]
c_stdlib:                     # [win]
    - vs                      # [win]
cxx_compiler:                 # [win]
    - vs2022                  # [win]
c_compiler:                   # [win]
    - vs2022                  # [win]
